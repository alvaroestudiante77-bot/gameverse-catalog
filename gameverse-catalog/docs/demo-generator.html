<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de demo GameVerse</title>
    <style>
      body { background: #0a0a12; color: #f7f5ff; font-family: system-ui, sans-serif; margin: 0; padding: 2rem; text-align: center; }
      canvas, video { border: 1px solid #39374a; border-radius: 10px; max-width: min(100%, 960px); width: 100%; }
      button, a { background: #c581ff; border: 0; border-radius: 8px; color: #201227; cursor: pointer; display: inline-block; font-weight: 700; margin: 1rem .35rem; padding: .75rem 1rem; text-decoration: none; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1>Video de demostración de GameVerse</h1>
    <p>Genera el video corto que ilustra búsqueda, filtro, favoritos y detalle.</p>
    <canvas id="canvas" width="1280" height="720" aria-label="Vista previa del video"></canvas>
    <div><button id="generate">Generar video (22 s)</button><a id="download" hidden download="gameverse-demo.webm">Descargar video</a></div>
    <video id="preview" controls hidden></video>
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const generate = document.getElementById('generate');
      const download = document.getElementById('download');
      const preview = document.getElementById('preview');
      const W = canvas.width, H = canvas.height;

      const colors = { bg: '#0b0b14', panel: '#161622', line: '#302f42', text: '#f7f5ff', muted: '#aaa6b9', purple: '#c995ff', pink: '#ed75af', cyan: '#56d9ff' };
      const cards = [
        ['Horizon: Nuevos Horizontes', '#e55c64'], ['Velocity League', '#1589c1'], ['Kingdoms of Ash', '#a7633f'], ['Neon Drift', '#bf3ab5'],
        ['The Last Signal', '#50856d'], ['Stadium Legends', '#4d83c6'], ['Emberfall Tactics', '#c65440'], ['Pulse Runner', '#1eaf83']
      ];

      function rect(x, y, w, h, fill, radius = 0, stroke = null) {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, radius); ctx.fillStyle = fill; ctx.fill();
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
      }
      function text(value, x, y, size, fill = colors.text, weight = 500, align = 'left') {
        ctx.fillStyle = fill; ctx.font = `${weight} ${size}px Arial`; ctx.textAlign = align; ctx.fillText(value, x, y);
      }
      function header() {
        ctx.fillStyle = colors.bg; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#181530'; ctx.fillRect(0, 0, W, 205);
        text('◈  GAMEVERSE', 70, 62, 20, colors.text, 700);
        text('TU PRÓXIMA AVENTURA EMPIEZA AQUÍ', 70, 112, 13, '#c7a4ff', 700);
        text('Encuentra tu juego. Hazlo favorito.', 70, 166, 38, colors.text, 700);
        text('COLECCIÓN', 70, 260, 13, '#c7a4ff', 700);
        text('Explora el catálogo', 70, 300, 30, colors.text, 700);
      }
      function toolbar(query = '', genre = 'Todos', favorites = false, count = 0, results = 10) {
        rect(70, 326, 1140, 94, '#151521', 14, colors.line);
        text('BUSCAR VIDEOJUEGOS', 95, 352, 11, colors.muted, 700);
        rect(95, 364, 414, 38, '#0e0e18', 8, colors.line);
        text('⌕  ' + (query || 'Escribe un título...'), 108, 390, 15, query ? colors.text : '#77748b', 500);
        text('GÉNERO', 540, 352, 11, colors.muted, 700);
        rect(540, 364, 206, 38, '#0e0e18', 8, colors.line);
        text(genre + '  ▾', 555, 390, 15, colors.text, 500);
        rect(780, 366, 22, 22, favorites ? colors.purple : '#151521', 5, favorites ? null : '#696578');
        if (favorites) text('♥', 791, 384, 15, '#28132f', 700, 'center');
        text('♥  Solo favoritos', 813, 390, 15, '#ded9e8', 500);
        rect(970, 369, 28, 24, '#29253a', 12); text(String(count), 984, 387, 13, '#d9b7ff', 700, 'center');
        text(`${results} resultado${results === 1 ? '' : 's'}`, 1160, 300, 13, colors.muted, 500, 'right');
      }
      function card(name, color, x, y, favorite = false) {
        rect(x, y, 255, 195, colors.panel, 12, '#29283c');
        rect(x, y, 255, 100, color, 12);
        ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x, y + 58, 255, 42);
        rect(x + 205, y + 12, 34, 34, favorite ? colors.pink : 'rgba(10,10,20,.7)', 17, '#f8f4ff');
        text(favorite ? '♥' : '♡', x + 222, y + 36, 20, favorite ? '#37101f' : colors.text, 700, 'center');
        text('ACCIÓN  ·  2025', x + 18, y + 126, 11, colors.muted, 700);
        text(name, x + 18, y + 155, 17, colors.text, 700);
        text('Ver detalle  →', x + 18, y + 181, 13, colors.purple, 700);
      }
      function grid(list, favorite = false) {
        list.forEach((item, index) => card(item[0], item[1], 70 + (index % 4) * 285, 448 + Math.floor(index / 4) * 220, favorite && item[0] === 'Neon Drift'));
      }
      function annotation(label, detail) {
        rect(70, 632, 1140, 62, '#27203a', 10, '#9e70d4');
        text(label, 94, 659, 17, '#f3dcff', 700);
        text(detail, 94, 682, 13, '#d7d0e5', 500);
      }
      function draw(t) {
        header();
        if (t < 4) {
          toolbar(); grid(cards); annotation('1. Catálogo de videojuegos', '10 tarjetas con nombre, imagen, género y año de lanzamiento.');
        } else if (t < 8) {
          const typed = 'Neon'.slice(0, Math.max(0, Math.min(4, Math.floor((t - 4) * 2))));
          toolbar(typed, 'Todos', false, 0, typed.length === 4 ? 1 : 10); grid(typed.length === 4 ? [['Neon Drift', '#bf3ab5']] : cards); annotation('2. Búsqueda en tiempo real', 'El resultado se actualiza mientras el usuario escribe.');
        } else if (t < 12) {
          toolbar('Neon', 'Acción', false, 0, 1); grid([['Neon Drift', '#bf3ab5']]); annotation('3. Filtro por género', 'La búsqueda y el filtro se aplican de forma simultánea.');
        } else if (t < 16) {
          toolbar('Neon', 'Acción', true, 1, 1); grid([['Neon Drift', '#bf3ab5']], true); annotation('4. Favoritos', 'Un clic en el corazón actualiza el contador y la vista de solo favoritos.');
        } else if (t < 20) {
          toolbar('Neon', 'Acción', true, 1, 1); grid([['Neon Drift', '#bf3ab5']], true);
          ctx.fillStyle = 'rgba(0,0,0,.64)'; ctx.fillRect(0, 0, W, H);
          rect(315, 165, 650, 380, '#191925', 16, '#514a69');
          rect(315, 165, 238, 380, '#bf3ab5', 16); text('NEON', 345, 260, 34, '#fff', 700); text('DRIFT', 345, 298, 26, '#9cfcff', 700);
          text('ACCIÓN', 590, 225, 13, '#d86cff', 700); text('Neon Drift', 590, 276, 40, colors.text, 700); text('Lanzamiento 2025', 590, 305, 13, colors.muted, 500);
          text('Domina una ciudad vertical iluminada por neón.', 590, 350, 16, '#cfccdc', 500); text('PC', 590, 405, 13, colors.text, 700); text('PlayStation 5', 636, 405, 13, colors.text, 700); text('Xbox Series', 755, 405, 13, colors.text, 700);
          rect(590, 445, 160, 38, colors.pink, 8); text('♥  En favoritos', 670, 470, 14, '#30101e', 700, 'center');
          annotation('5. Detalle del videojuego', 'El modal muestra descripción, datos principales, plataformas y favoritos.');
        } else {
          toolbar('', 'Todos', false, 1, 10); grid(cards, true); annotation('GameVerse listo', 'Búsqueda, filtro, favoritos y detalle implementados con React.');
        }
      }
      draw(0);
      generate.addEventListener('click', () => {
        generate.disabled = true; generate.textContent = 'Generando...';
        const stream = canvas.captureStream(18);
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 2500000 });
        const chunks = []; recorder.ondataavailable = event => chunks.push(event.data);
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob);
          preview.src = url; preview.hidden = false; download.href = url; download.hidden = false; generate.textContent = 'Video generado';
        };
        const started = performance.now(); recorder.start();
        function frame(now) {
          const seconds = (now - started) / 1000; draw(seconds);
          if (seconds < 22) requestAnimationFrame(frame); else recorder.stop();
        }
        requestAnimationFrame(frame);
      });
    </script>
  </body>
</html>
